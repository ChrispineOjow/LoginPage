<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="script.js" defer></script>
    <title>Login</title>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-200">

    <!-- Dark/Light Mode Icon Button -->
    <div class="absolute top-4 right-4">
        <button 
            id="themeToggle" 
            class="p-2.5 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 shadow-sm transition-all focus:outline-none"
            aria-label="Toggle theme"
        >
            <!-- Sun Icon (shows in Dark Mode) -->
            <svg id="sunIcon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd"></path>
            </svg>
            
            <!-- Moon Icon (shows in Light Mode) -->
            <svg id="moonIcon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
        </button>
    </div>

    <div id="login" class="flex items-center justify-center min-h-screen px-4">

        <div class="w-full max-w-sm p-8 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Welcome Back</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Please enter your details</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 text-left">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="you@example.com"
                        class="w-full px-3 py-2 mt-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                        required
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 text-left">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••"
                        class="w-full px-3 py-2 mt-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                        required
                    >
                </div>

                <div class="flex items-center justify-between text-xs mt-2">
                    <label class="flex items-center text-gray-600 dark:text-gray-400">
                        <input type="checkbox" id="rememberMe" class="rounded border-gray-300 dark:border-gray-600 text-indigo-600 focus:ring-indigo-500 mr-2 dark:bg-gray-700">
                        Remember me
                    </label>
                    <a href="#" class="text-indigo-600 dark:text-indigo-400 hover:underline">Forgot password?</a>
                </div>

                <div class="pt-2">
                    <button 
                        type="submit" 
                        class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm shadow-sm transition-colors duration-150"
                    >
                        Sign In
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500 dark:text-gray-400">
                Don't have an account? 
                <a href="#" id="signupLink" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Sign up</a>
            </div>

        </div>
    </div>

</body>
</html>
